<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Zenkai</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #101014;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      background: #C51F3A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #fff;
    }
    h1 { margin: 1rem 0; }
    p { color: #aaa; margin-bottom: 2rem; }
    button {
      background: #C51F3A;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📖</h1>
    <h1>You're Offline</h1>
    <p>Zenkai requires an internet connection to load anime and manga data.</p>
    <button onClick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
